[build-system]
requires = ["flit_core >= 3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "pydeface"
version = "2.1.1-dev"
maintainers = [
    { name="Russ Poldrack", email="poldrack@stanford.edu"}
]
description = "A script to remove facial structure from MRI images"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS"
]
license = "MIT"
license-files = ["LICENSE.txt"]
dependencies = [
    "numpy>=2.0",
    "nibabel>=5.3",
    "nipype>=1.9",
]

[dependency-groups]
test = [
    "pytest>=9.0.2", "pytest-cov>=7.1.0",
]

[project.scripts]
pydeface = "pydeface.__main__:main"

[project.urls]
homepage = "https://www.poldracklab.org/"
source = "https://github.com/poldracklab/pydeface"

[tool.flit.sdist]
include = [
    "Dockerfile",
    "tests/"
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = [
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "ISC",  # flake8-implicit-str-concat
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "SIM",  # flake8-simplify
    "FLY",  # flynt
    "I",    # isort
    "N",    # pep8-naming
    "PERF", # Perflint
    "PGH",  # pygrep-hooks
    "UP",   # pyupgrade
    "FURB", # refurb
    "RUF",  # Ruff-specific rules
]
ignore = [
    "S101", # Use of `assert` detected
    "B028", # No explicit stacklevel keyword argument found
]

# Define pixi environments to install FLIRT along with Python
# Use `pixi install` to create a production environment
# Use `pixi shell -e dev` to work in a development environment
[tool.pixi.workspace]
channels = ["https://fsl.fmrib.ox.ac.uk/fsldownloads/fslconda/public", "conda-forge"]
platforms = ["linux-64"]

[tool.pixi.activation.env]
FSLDIR = "$CONDA_PREFIX"
FSLOUTPUTTYPE = "NIFTI_GZ"

[tool.pixi.feature.fsl.dependencies]
fsl-flirt = ">=2111.4"

# Install pydeface editable except in production
[tool.pixi.pypi-dependencies]
pydeface = { path = ".", editable = true }
[tool.pixi.feature.production.pypi-dependencies]
pydeface = { path = ".", editable = false }

[tool.pixi.environments]
default = ["production", "fsl"]
dev = ["test", "fsl"]
min = ["min", "test", "fsl"]
# Test environments for Python minor release series between min and dev
# Python tests only
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.min]
solve-strategy = "lowest-direct"
# numpy and nibabel are installed from conda as FSL dependencies, so the
# minimum versions must be repeated here for lowest-direct to apply to them.
[tool.pixi.feature.min.dependencies]
# Sync with requires-python
python = "3.10.*"
# sync with project.dependencies
numpy = ">=2.0"
nibabel = ">=5.3"
